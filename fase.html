<!-- Modal emergente para detalle de actividad/artefacto BPMN interactivo -->
<dialog id="activityDetailModal" style="border:none;border-radius:10px;padding:0;max-width:680px;width:92%;box-shadow:0 15px 40px rgba(0,0,0,0.25);background:#ffffff;">
  <div style="background:#0f2723;color:#ffffff;padding:1.2rem 1.6rem;display:flex;justify-content:space-between;align-items:center;border-top-left-radius:10px;border-top-right-radius:10px;">
    <div>
      <span id="modalActivityCode" style="display:inline-block;background:rgba(255,255,255,0.18);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:0.85rem;font-weight:700;letter-spacing:0.04em;">Actividad</span>
      <h3 id="modalActivityTitle" style="margin:0.35rem 0 0;font-size:1.25rem;font-weight:700;color:#ffffff;font-family:Newsreader,serif;">Nombre del elemento</h3>
    </div>
    <button id="btnCloseActivityModal" type="button" aria-label="Cerrar modal" style="background:rgba(255,255,255,0.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s;">✕</button>
  </div>
  <div id="modalActivityBody" style="padding:1.5rem 1.8rem;max-height:70vh;overflow-y:auto;line-height:1.65;font-size:0.95rem;color:var(--ink);">
    <!-- Contenido inyectado dinámicamente -->
  </div>
  <div style="padding:0.9rem 1.6rem;background:#f8faf9;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;border-bottom-left-radius:10px;border-bottom-right-radius:10px;">
    <span style="font-size:0.82rem;color:var(--muted);">Proceso PDAEH · Especificación formal de fases y actividades</span>
    <button id="btnModalScrollToList" type="button" style="padding:6px 14px;border:1px solid var(--green);background:transparent;color:var(--green);font-size:0.82rem;font-weight:600;border-radius:4px;cursor:pointer;">Ver en la lista desplegable ↓</button>
  </div>
</dialog>
